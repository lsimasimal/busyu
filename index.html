<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Busyu / Dosu</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Busyu">
<meta name="theme-color" content="#EEEAE2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEEAE2; --ink:#2A2620; --muted:#6F675C; --field:#FBF9F5; --line:#DCD4C7;
  --shu:#C8402E; --slab:#A8916F; --ai:#2F6DB5; --gold:#E0A100;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15130F;--ink:#EEE8DE;--muted:#9C9384;--field:#1F1C17;--line:#3A352D;--shu:#F07A6A;--slab:#6E5E47;--ai:#6FA8E8;--gold:#F2C14E}
}
:root[data-theme="dark"]{--bg:#15130F;--ink:#EEE8DE;--muted:#9C9384;--field:#1F1C17;--line:#3A352D;--shu:#F07A6A;--slab:#6E5E47;--ai:#6FA8E8;--gold:#F2C14E}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:10px 12px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
.top{display:flex;justify-content:space-between;align-items:flex-end;width:100%;max-width:440px;margin-bottom:6px;gap:8px}
.brand{display:flex;align-items:center;gap:8px}
h1{font-weight:900;font-size:1.6rem;margin:0;letter-spacing:.02em}
h1 span{color:var(--shu)}
.icon{font:inherit;font-size:1rem;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.icon[aria-pressed="false"]{opacity:.45}
.stat{text-align:right;font-variant-numeric:tabular-nums}
.stat b{font-size:1.6rem;font-weight:900}
.stat small{display:block;color:var(--muted);font-size:.72rem}
.stage{position:relative;flex:1;min-height:0;width:100%;max-width:440px;display:flex;justify-content:center}
canvas{display:block;height:100%;max-width:100%;touch-action:none;border-radius:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;max-width:440px;min-height:30px}
.chip{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--field);border:1px solid var(--line);font-size:.8rem;font-weight:700}
.chip i{font-style:normal;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:.9rem;background:var(--ink)}
.chip.plain{padding:4px 12px}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;
  gap:8px;padding:16px;text-align:center;overflow-y:auto;border-radius:14px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);z-index:5;
}
.overlay[hidden]{display:none}
.overlay h2{font-size:clamp(1.9rem,8vw,2.5rem);font-weight:900;margin:0}
.overlay p{margin:0;color:var(--muted);line-height:1.6;font-size:.84rem}
.overlay .big{font-size:1.4rem;color:var(--ink);font-weight:900}
.label{font-weight:700;font-size:.8rem;color:var(--ink);margin-top:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seg button{
  font:inherit;font-weight:900;font-size:.95rem;min-width:46px;padding:6px 10px;border-radius:12px;
  border:2px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;
}
.seg button[aria-pressed="true"]{border-color:var(--shu);background:var(--shu);color:#fff}
.seg button:disabled{opacity:.35;cursor:default}
.seg small{display:block;font-size:.6rem;font-weight:500;font-family:"Zen Maru Gothic",sans-serif}
.seg.mode button{min-width:118px;padding:8px 12px}
.seg.mode b{display:block;font-size:1.15rem}
.seg.fonts button{min-width:56px;font-size:1.4rem;line-height:1.1;padding:5px 7px}
.seg.stages button{min-width:40px}
.goal{color:var(--ink)!important;font-weight:700}
.toggle{display:flex;align-items:center;gap:8px;font-size:.86rem;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--shu)}
.opts{display:flex;flex-direction:column;align-items:center;gap:6px}
.opts[hidden]{display:none}
button.go,button.sub{
  font:inherit;font-weight:900;font-size:1.05rem;border:none;border-radius:999px;padding:11px 28px;
  background:var(--shu);color:#fff;cursor:pointer;
}
button.go:disabled{opacity:.6}
button.sub{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btns [hidden]{display:none}
.fab{
  position:absolute;bottom:12px;height:58px;min-width:58px;border-radius:999px;padding:0 14px;
  border:none;background:var(--ink);color:var(--field);font:inherit;font-size:1.6rem;font-weight:900;cursor:pointer;touch-action:none;z-index:2;
}
.fab[hidden]{display:none}
#rot{right:12px}
#shake{left:16px;top:52px;bottom:auto;height:40px;min-width:0;padding:0 12px;font-size:.85rem;background:var(--gold);color:#2A2620}
/* zukan */
#zukan{justify-content:flex-start;background:var(--bg)}
.ztabs{display:flex;gap:6px}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;width:100%;max-width:400px}
.zgrid.words{grid-template-columns:repeat(auto-fill,minmax(82px,1fr))}
.zgrid button{font:inherit;font-size:1.35rem;font-weight:900;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;padding:0}
.zgrid.words button{font-size:1.1rem}
.zgrid button.un{color:var(--line);font-size:1rem}
.zcard{width:100%;max-width:400px;background:var(--field);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:14px;align-items:center;text-align:left}
.zcard[hidden]{display:none}
.zcard .zk{font-size:3rem;font-weight:900;line-height:1;min-width:64px;text-align:center}
.zcard .zk.w{font-size:2rem}
.zcard div p{color:var(--ink);font-size:.86rem}
.zcard div p.m{color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <h1 id="logo">Bu<span>syu</span></h1>
    <button class="icon" id="sfxBtn" aria-label="効果音">🔊</button>
    <button class="icon" id="bgmBtn" aria-label="BGM">🎵</button>
  </div>
  <div class="stat"><small id="lv"></small><b id="score">0</b><small id="best"></small></div>
</div>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <button class="fab" id="rot" hidden aria-label="回転">↻</button>
  <button class="fab" id="shake" hidden aria-label="箱をゆらす">ゆらす</button>
  <div class="overlay" id="start">
    <div class="seg mode" id="modes" role="group" aria-label="モード">
      <button data-mode="busyu"><b>Busyu</b><small>同じ部首で消す</small></button>
      <button data-mode="dosu"><b>Dosu</b><small>落とさず積む</small></button>
    </div>
    <div class="seg" id="plays" role="group" aria-label="遊び方"></div>
    <p id="desc"></p>
    <div class="opts" id="stageOpts">
      <div class="seg stages" id="stages"></div>
      <p class="goal" id="stageGoal"></p>
    </div>
    <div class="opts" id="busyuOpts">
      <div class="label">出てくる部首の数</div>
      <div class="seg" id="counts"></div>
      <label class="toggle"><input type="checkbox" id="hint" checked>部首ごとに色分けする</label>
    </div>
    <div class="label">漢字の範囲</div>
    <div class="seg" id="grades"></div>
    <div class="label">フォント</div>
    <div class="seg fonts" id="fonts" role="group" aria-label="フォント"></div>
    <p id="howto"></p>
    <div class="btns">
      <button class="go" id="startBtn">スタート</button>
      <button class="sub" id="zkBtn1">📖 図鑑</button>
    </div>
  </div>
  <div class="overlay" id="over" hidden>
    <h2 id="overTitle"></h2>
    <p class="big" id="result"></p>
    <p id="detail"></p>
    <div class="btns">
      <button class="go" id="nextBtn" hidden>つぎのステージ</button>
      <button class="go" id="retryBtn">もう一回</button>
      <button class="sub" id="setBtn">設定を変える</button>
      <button class="sub" id="zkBtn2">📖 図鑑</button>
    </div>
  </div>
  <div class="overlay" id="zukan" hidden>
    <h2 style="font-size:1.6rem">漢字図鑑</h2>
    <p id="zkCount"></p>
    <div class="seg ztabs" id="ztabs"></div>
    <div class="zcard" id="zcard" hidden></div>
    <div class="zgrid" id="zgrid"></div>
    <button class="sub" id="zkClose">とじる</button>
  </div>
</div>
<div class="legend" id="legend"></div>

<script src="matter.min.js"></script>

let actx=null,master=null,bgmGain=null,sfxOn=store("bd-sfx")!=="0",bgmOn=store("bd-bgm")==="1";
function ac(){
  if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();master=actx.createGain();master.gain.value=.8;master.connect(actx.destination);
    bgmGain=actx.createGain();bgmGain.gain.value=.22;bgmGain.connect(master)}catch(e){return null}}
  if(actx.state==="suspended")actx.resume();return actx;
}
function tone(f,dur,type="triangle",vol=.15,when=0,slide=0,dest=null){
  if(!actx)return;const t=actx.currentTime+when,o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol,freq,when=0){
  if(!actx)return;const t=actx.currentTime+when,n=Math.floor(actx.sampleRate*dur),buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();s.buffer=buf;f.type="lowpass";f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);
}

const SCALE=[62,64,67,69,71,74,76,79,81];
let bgmTimer=null,bgmT=0,bgmStep=0,phrase=[];
function makePhrase(){let i=4;const p=[];for(let s=0;s<32;s++){if(Math.random()<.28){p.push(null);continue}i=Math.max(0,Math.min(SCALE.length-1,i+Math.floor(Math.random()*5)-2));p.push(SCALE[i])}return p}
function startBgm(){
  if(!bgmOn||bgmTimer||!ac())return;
  bgmT=actx.currentTime+.1;bgmStep=0;phrase=makePhrase();
  const spb=60/92/2,bass=[50,50,55,57];
  bgmTimer=setInterval(()=>{
    while(bgmT<actx.currentTime+.15){
      const n=phrase[bgmStep%32],w=bgmT-actx.currentTime;
      if(n)tone(NOTE(n),spb*1.6,"triangle",.5,w,0,bgmGain);
      if(bgmStep%4===0)tone(NOTE(bass[Math.floor(bgmStep/8)%4]-12),spb*3.5,"sine",.6,w,0,bgmGain);
      bgmT+=spb;bgmStep++;if(bgmStep%64===0)phrase=makePhrase();
    }

}

// ================= glyph -> collision shape =================
const WW=360,WH=580,S0=50,FR=.96,N=12,RES=96,shapeCache={};
const off=document.createElement("canvas");off.width=off.height=RES;
const octx=off.getContext("2d",{willReadFrequently:true});
function shapeFor(k){
  const key=F.id+k;if(shapeCache[key])return shapeCache[key];
  octx.clearRect(0,0,RES,RES);
  octx.font=fontStr(RES*FR);octx.textAlign="center";octx.textBaseline="middle";octx.fillStyle="#000";
  octx.fillText(k,RES/2,RES/2);
  const px=octx.getImageData(0,0,RES,RES).data,cs=RES/N,grid=[];
  for(let gy=0;gy<N;gy++){const row=[];for(let gx=0;gx<N;gx++){
    let ink=0,tot=0;
    for(let y=Math.floor(gy*cs);y<Math.floor((gy+1)*cs);y++)for(let x=Math.floor(gx*cs);x<Math.floor((gx+1)*cs);x++){tot++;if(px[(y*RES+x)*4+3]>110)ink++}
    row.push(ink/tot>.2);
  }grid.push(row)}
  const used=grid.map(r=>r.map(()=>false)),rects=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(!grid[y][x]||used[y][x])continue;
    let w=1;while(x+w<N&&grid[y][x+w]&&!used[y][x+w])w++;
    let h=1;
    outer:while(y+h<N){for(let i=0;i<w;i++)if(!grid[y+h][x+i]||used[y+h][x+i])break outer;h++}
    for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)used[yy][xx]=true;
    rects.push({x,y,w,h});
  }
  if(!rects.length)rects.push({x:N/2-2,y:N/2-2,w:4,h:4});
  const c=S0/N;
  return shapeCache[key]=rects.map(r=>({x:(r.x+r.w/2)*c-S0/2,y:(r.y+r.h/2)*c-S0/2,w:r.w*c,h:r.h*c}));
}

const {Engine,Bodies,Composite,Events,Body,Sleeping}=Matter;
// spec = {glyphs:[{k,dx,rad?,oj?,item?}], sc, color?, kind?}; (x,y) = centre of the glyph group
function buildBody(spec,x,y,angle,opts={}){
  const parts=[];
  spec.glyphs.forEach((g,gi)=>{for(const r of shapeFor(g.k)){
    const pt=Bodies.rectangle(x+(g.dx+r.x)*spec.sc,y+r.y*spec.sc,r.w*spec.sc,r.h*spec.sc,{density:.002});pt.gi=gi;parts.push(pt)}});
  const b=Body.create({parts,friction:opts.friction??.5,frictionStatic:1,frictionAir:opts.air??.01,restitution:.02,label:opts.label});
  b.off={x:x-b.position.x,y:y-b.position.y};
  if(angle)Body.rotate(b,angle,{x,y});
  if(opts.static)Body.setStatic(b,true);
  b.spec=spec;b.born=now;
  return b;
}
const glyphColor=(s,g)=>g.oj?COL.muted:g.rad?($("hint").checked?g.rad.color:COL.ink):(s.color||COL.ink);
function drawSpec(spec,x,y,a,offv,alpha=1,extra=1){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);if(offv)ctx.translate(offv.x,offv.y);ctx.scale(spec.sc*extra,spec.sc*extra);
  ctx.globalAlpha=alpha;ctx.textAlign="center";ctx.textBaseline="middle";
  for(const g of spec.glyphs){
    ctx.font=fontStr(S0*FR);
    if(g.item){ctx.shadowColor=COL.gold;ctx.shadowBlur=10+6*Math.sin(clock*6)}
    ctx.fillStyle=glyphColor(spec,g);ctx.fillText(g.k,g.dx,0);ctx.shadowBlur=0;
    if(g.item){ctx.font=`16px sans-serif`;ctx.fillText(g.item==="bomb"?"💣":"〰️",g.dx+S0*.4,-S0*.4)}
  }
  ctx.restore();
}
const drawBody=(b,alpha,extra)=>drawSpec(b.spec,b.position.x,b.position.y,b.angle,b.off,alpha,extra);
function glyphCenter(b,i){
  const lx=b.off.x+b.spec.glyphs[i].dx*b.spec.sc,ly=b.off.y,c=Math.cos(b.angle),s=Math.sin(b.angle);
  return{x:b.position.x+lx*c-ly*s,y:b.position.y+lx*s+ly*c};
}

function busyuPiece(prev){
  bseq++;

    return{glyphs:[{k:w[0],dx:-S0/2,rad:radOf[w[0]]},{k:w[1],dx:S0/2,rad:radOf[w[1]]}],sc:1,kind:"熟語"}}
  if(bseq>8&&Math.random()<ojamaRate){const pool=OJAMA.filter(inGrade);const k=pool[Math.floor(Math.random()*pool.length)]||OJAMA[0];
    return{glyphs:[{k,dx:0,rad:null,oj:true}],sc:1,kind:"お邪魔"}}
  // "jukugo chance": the next kanji can join the previous one into a word
  if(prev&&prev.glyphs.length===1&&!prev.glyphs[0].oj&&Math.random()<chanceRate){
    const c=prev.glyphs[0].k,opts=jukuList.filter(w=>w.includes(c));
    if(opts.length){const w=opts[Math.floor(Math.random()*opts.length)],k=w[0]===c?w[1]:w[0];
      return{glyphs:[{k,dx:0,rad:radOf[k]}],sc:1,kind:"チャンス",word:w}}

  if(bseq>5&&Math.random()<itemRate){g.item=Math.random()<.6?"bomb":"shake";return{glyphs:[g],sc:1,kind:g.item==="bomb"?"ボム":"ゆらし"}}

let removeMap=null;

// ================= loop =================
const STEP=1000/120;
function guide(x,y0,y1){ctx.strokeStyle=COL.line;ctx.lineWidth=2;ctx.setLineDash([3,6]);ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,y1);ctx.stroke();ctx.setLineDash([])}
function update(dt){
  now+=dt;acc+=dt*1000;
  while(acc>=STEP){
    if(mode==="dosu")eventForces();
    Engine.update(engine,STEP);
    for(const b of Composite.allBodies(engine.world))if(!b.isStatic&&b.velocity.y>9)Body.setVelocity(b,{x:b.velocity.x,y:9});
    if(mode==="busyu"){jukuCheckT+=STEP;const cj=jukuCheckT>150;if(cj)jukuCheckT=0;processClears(cj)}
    acc-=STEP;
  }
  if(!running)return;
  if(keys.left)holdX-=260*dt;if(keys.right)holdX+=260*dt;
  holdX=Math.min(Math.max(holdX,20),WW-20);
  if(mode==="busyu")busyuUpdate(dt);else dosuUpdate(dt);
  if(running)checkStage();
  hud();
}
function goalValue(){
  return{clear:cleared,combo:maxCombo,juku:jukuDone,ojama:ojamaCleared,score,placed,height:maxH,shiri:shiriDone}[stg.goal];
}
function checkStage(){if(play==="stage"&&stg&&goalValue()>=stg.n)stageClear()}

  if(!engine)return;

  if(shakeFx>0){ctx.translate((Math.random()-.5)*shakeFx,(Math.random()-.5)*shakeFx);shakeFx*=.92;if(shakeFx<.3)shakeFx=0}

  for(const g of ghosts)drawSpec(g.spec,g.x,g.y,g.a,null,Math.max(0,1-g.t/.3),1+g.t*1.2);

    const x=Math.min(Math.max(f.x,90),WW-90),y=f.y-f.t*30;

}
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;clock+=dt;
  if(sim)update(dt);
  for(const g of ghosts)g.t+=dt;ghosts=ghosts.filter(g=>g.t<.3);
  for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<(f.big?1.8:1));
  for(const b of banners)b.t+=dt;banners=banners.filter(b=>b.t<1.5);
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
  draw();requestAnimationFrame(loop);
}
function hud(){
  $("score").textContent=play==="vs"?placed:score;
  if(mode==="busyu"){$("lv").textContent=`レベル ${level()}・${cleared}個消した`;
    const b=store("busyu-best-"+count);$("best").textContent=play==="free"?(`部首${count}つ`+(b?` ベスト ${b}`:"")):`ステージ ${stageIdx.busyu+1}`}
  else if(play==="vs"){$("lv").textContent=`2人対戦・高さ ${maxH.toFixed(1)}字`;$("best").textContent="積んだ数"}
  else{$("lv").textContent=`${placed}個・高さ ${maxH.toFixed(1)}字`;const b=store("dosu-best");$("best").textContent=play==="free"?(b?`ベスト ${b}`:""):`ステージ ${stageIdx.dosu+1}`}
}

// ================= input =================
const keys={};
const toWorld=e=>{const r=cv.getBoundingClientRect();return(e.clientX-r.left)/r.width*WW};
let pressing=false;
cv.addEventListener("pointerdown",e=>{if(!running)return;pressing=true;holdX=toWorld(e);cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{if(running&&(pressing||e.pointerType==="mouse"))holdX=toWorld(e)});
cv.addEventListener("pointerup",e=>{if(!pressing)return;pressing=false;holdX=toWorld(e);drop()});
cv.addEventListener("pointercancel",()=>pressing=false);
const rotate=()=>{if(running&&mode==="dosu"&&hold)holdA+=Math.PI/4};
$("rot").addEventListener("pointerdown",e=>{e.preventDefault();rotate()});
$("shake").addEventListener("pointerdown",e=>{e.preventDefault();doShake()});
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"){keys.left=true;e.preventDefault()}
  if(e.key==="ArrowRight"){keys.right=true;e.preventDefault()}
  if((e.key==="ArrowUp"||e.key==="r"||e.key==="R")&&running){e.preventDefault();rotate()}
  if((e.key==="s"||e.key==="S")&&running)doShake();
  if((e.key===" "||e.key==="ArrowDown")&&running){e.preventDefault();drop()}
});
addEventListener("keyup",e=>{if(e.key==="ArrowLeft")keys.left=false;if(e.key==="ArrowRight")keys.right=false});
const drop=()=>{if(!running)return;mode==="busyu"?busyuDrop():dosuDrop()};

// ================= menus =================
const DESC={
  busyu:["同じ部首の漢字どうしがくっつくと消えます。熟語になる2字を読める向きに並べると大ボーナス。灰色のお邪魔字は光る💣ボムで消せます。",
         "指で位置を決めて離すと落下（PCはマウスとクリック、←→とSpaceも可）。〰️を消すと「ゆらす」が使えます（PCはSキー）"],
  dosu:["四字熟語の土台に漢字を積もう。両側は穴、落ちたら終わり。5個ごとに大きさが変わり、10個ごとに熟語。前の字と熟語になる字を上に乗せると「しりとり積み」ボーナス。高くなると風や地震も。",
        "指で位置を決めて離すと落下、右下の↻で回転（PCはマウスとクリック、↑かRで回転）"],
};
function buildMenu(){
  if(mode==="busyu"&&play==="vs")play="free";
  document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  const plays=[["free","フリー"],["stage","ステージ"]];if(mode==="dosu")plays.push(["vs","2人対戦"]);
  const pb=$("plays");pb.innerHTML="";
  for(const [id,name] of plays){const b=document.createElement("button");b.textContent=name;b.setAttribute("aria-pressed",id===play);
    b.onclick=()=>{play=id;store("bd-play",id);buildMenu()};pb.appendChild(b)}
  $("desc").innerHTML=play==="vs"?"1台を2人で交互に使って積み上げます。自分の番で字を落としたら負け。":DESC[mode][0];
  $("howto").innerHTML=DESC[mode][1];
  $("busyuOpts").hidden=!(mode==="busyu"&&play==="free");
  $("stageOpts").hidden=play!=="stage";
  $("logo").innerHTML=mode==="busyu"?"Bu<span>syu</span>":"Do<span>su</span>";
  document.title=mode==="busyu"?"Busyu":"Dosu";
  // stages
  const list=mode==="busyu"?BSTAGES:DSTAGES,done=cleared_[mode];
  stageIdx[mode]=Math.min(stageIdx[mode],done,list.length-1);
  const sb=$("stages");sb.innerHTML="";
  list.forEach((s,i)=>{const b=document.createElement("button");b.disabled=i>done;b.setAttribute("aria-pressed",i===stageIdx[mode]);
    b.innerHTML=`${i+1}<small>${i<done?"✓":i>done?"🔒":"&nbsp;"}</small>`;b.onclick=()=>{stageIdx[mode]=i;buildMenu()};sb.appendChild(b)});
  const cs=list[stageIdx[mode]];$("stageGoal").textContent=`ステージ${stageIdx[mode]+1}：${cs.text}`+(mode==="busyu"?`（部首${cs.count}つ）`:"");
  // counts
  const av=availRads().length,cb=$("counts");cb.innerHTML="";
  for(const c of COUNTS){const b=document.createElement("button");b.setAttribute("aria-pressed",c===count);b.disabled=c>av;
    const best=store("busyu-best-"+c);b.innerHTML=`${c}<small>${best?"ベスト "+best:"&nbsp;"}</small>`;
    b.onclick=()=>{count=c;store("busyu-count",c);buildMenu()};cb.appendChild(b)}
  if(count>av){count=COUNTS.filter(c=>c<=av).pop();buildMenu();return}
  const gb=$("grades");gb.innerHTML="";
  for(const g of GRADES){const b=document.createElement("button");b.textContent=g.name;b.setAttribute("aria-pressed",g.g===grade);
    b.onclick=()=>{grade=g.g;store("bd-grade",g.g);buildMenu()};gb.appendChild(b)}
  const fb=$("fonts");fb.innerHTML="";
  for(const f of FONTS){const b=document.createElement("button");b.setAttribute("aria-pressed",f===F);b.setAttribute("aria-label",f.name);
    b.style.fontFamily=`${f.family},${FALLBACK}`;b.style.fontWeight=f.weight;b.innerHTML=`字<small>${f.name}</small>`;
    b.onclick=()=>{F=f;store("bd-font",f.id);buildMenu()};fb.appendChild(b)}
}
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{
  if(b.dataset.mode!==mode&&!running){engine=null;sim=false;next=null;$("legend").innerHTML=""} // stop drawing the previous mode's board
  mode=b.dataset.mode;store("bd-mode",mode);buildMenu()});
function buildLegend(){
  const el=$("legend");el.innerHTML="";
  if(mode==="busyu")for(const r of active){const d=document.createElement("div");d.className="chip";
    d.innerHTML=`<i style="${$("hint").checked?`background:${r.color}`:""}">${r.sym}</i>${r.name}`;el.appendChild(d)}
  else{const d=document.createElement("div");d.className="chip plain";d.textContent=`土台：${idiom}（${WORDS[idiom].yomi}）`;el.appendChild(d)}
}

async function start(){
  ac();startBgm();
  $("startBtn").disabled=true;$("startBtn").textContent="読み込み中…";$("retryBtn").disabled=true;
  try{await Promise.race([document.fonts.load(fontStr(40),ALL_KANJI.join("")+DOSU_JUKUGO.join("")+IDIOMS.join("")),new Promise(r=>setTimeout(r,4000))])}catch(e){}
  $("startBtn").disabled=false;$("startBtn").textContent="スタート";$("retryBtn").disabled=false;
  $("start").hidden=true;$("over").hidden=true;$("zukan").hidden=true;
  stg=play==="stage"?(mode==="busyu"?BSTAGES:DSTAGES)[stageIdx[mode]]:null;
  if(play==="free"||play==="vs")$("hint").checked=store("busyu-hint")!=="0";
  else if(stg&&stg.hint!==false)$("hint").checked=true;
  engine=Engine.create();engine.gravity.y=1;engine.positionIterations=8;engine.velocityIterations=6;
  Events.on(engine,"collisionStart",onLand);
  now=0;acc=0;score=0;ghosts=[];floats=[];particles=[];banners=[];camY=0;holdX=WW/2;newSeen=0;timeLeft=0;
  if(mode==="busyu")busyuInit();else dosuInit();
  buildLegend();hud();
  $("rot").hidden=mode!=="dosu";$("shake").hidden=true;
  running=true;sim=true;
  if(stg)banner(`お題：${stg.text.replace(/（.*）/,"")}`,COL.ink);
}
function finish(){running=false;$("rot").hidden=true;$("shake").hidden=true}
function endGame(title){
  finish();let detail;
  if(play==="vs"){detail=`${placed}個・高さ ${maxH.toFixed(1)}字まで積みました`;sfx("win")}
  else if(play==="stage"){detail=`ステージ${stageIdx[mode]+1}：${stg.text}`;sfx("over")}
  else if(mode==="busyu"){
    const key="busyu-best-"+count,prev=+store(key)||0;
    detail=`部首${active.length}つ・${cleared}個消した・熟語${jukuDone}つ・最大${maxCombo}コンボ`+(score>prev?"　自己ベスト更新！":prev?`　ベスト ${prev}`:"");
    if(score>prev)store(key,score);sfx("over");
  }else{
    const prev=+store("dosu-best")||0;
    detail=`${placed}個積んだ・最高 ${maxH.toFixed(1)}字・しりとり${shiriDone}回`+(score>prev?"　自己ベスト更新！":prev?`　ベスト ${prev}`:"");
    if(score>prev)store("dosu-best",score);
    if(maxH>(+store("dosu-besth")||0))store("dosu-besth",maxH.toFixed(1));sfx("over");
  }
  if(newSeen)detail+=`<br>📖 図鑑に${newSeen}件追加！`;
  $("overTitle").textContent=title;$("result").textContent=play==="vs"?"":`${score} 点`;$("detail").innerHTML=detail;
  $("nextBtn").hidden=true;$("retryBtn").textContent="もう一回";
  hud();
  setTimeout(()=>{sim=false;$("over").hidden=false;$("retryBtn").focus()},900);
}
function stageClear(){
  finish();sfx("win");
  const list=mode==="busyu"?BSTAGES:DSTAGES,i=stageIdx[mode];
  if(i+1>cleared_[mode])store("bd-stage-"+mode,i+1);
  $("overTitle").textContent="ステージクリア！";$("result").textContent=`${score} 点`;
  $("detail").innerHTML=`ステージ${i+1}：${stg.text}`+(i+1>=list.length?"<br>全ステージクリア、おめでとう！":"")+(newSeen?`<br>📖 図鑑に${newSeen}件追加！`:"");
  $("nextBtn").hidden=i+1>=list.length;$("retryBtn").textContent="もう一回";
  hud();
  setTimeout(()=>{sim=false;$("over").hidden=false;($("nextBtn").hidden?$("retryBtn"):$("nextBtn")).focus()},900);
}
$("startBtn").onclick=start;$("retryBtn").onclick=start;
$("nextBtn").onclick=()=>{stageIdx[mode]++;start()};
$("setBtn").onclick=()=>{$("over").hidden=true;buildMenu();$("start").hidden=false};
$("hint").onchange=()=>{store("busyu-hint",$("hint").checked?"1":"0")};

// ================= zukan screen =================
let ztab="k",zFrom=null;
function openZukan(from){zFrom=from;$(from).hidden=true;$("zukan").hidden=false;$("zcard").hidden=true;buildZukan()}
function buildZukan(){
  const tabs=[["k","漢字",ALL_KANJI],["w","熟語",DOSU_JUKUGO],["i","四字熟語",IDIOMS]];
  const total=tabs.reduce((s,t)=>s+t[2].length,0),got=tabs.reduce((s,t)=>s+t[2].filter(x=>ZK[t[0]][x]).length,0);
  $("zkCount").textContent=`あつめた数 ${got} / ${total}`;
  const tb=$("ztabs");tb.innerHTML="";
  for(const [id,name,list] of tabs){const b=document.createElement("button");b.setAttribute("aria-pressed",id===ztab);
    b.innerHTML=`${name}<small>${list.filter(x=>ZK[id][x]).length}/${list.length}</small>`;b.onclick=()=>{ztab=id;$("zcard").hidden=true;buildZukan()};tb.appendChild(b)}
  const list=tabs.find(t=>t[0]===ztab)[2],grid=$("zgrid");grid.innerHTML="";grid.className="zgrid"+(ztab==="k"?"":" words");
  for(const x of list){const b=document.createElement("button");const has=ZK[ztab][x];
    if(has){b.textContent=x;b.style.fontFamily=`${F.family},${FALLBACK}`;b.onclick=()=>showCard(x)}
    else{b.textContent="？";b.className="un";b.setAttribute("aria-label","まだ出会っていない");b.disabled=true}
    grid.appendChild(b)}
}
function showCard(x){
  const c=$("zcard");c.hidden=false;
  if(ztab==="k"){const d=KDATA[x];
    c.innerHTML=`<span class="zk" style="font-family:${F.family},${FALLBACK}">${x}</span><div><p>音：${d.on}　訓：${d.kun}</p><p class="m">意味：${d.mean}</p><p class="m">${d.rad?`部首：${d.rad}　`:"お邪魔字　"}${gradeName(d.g)}</p></div>`}
  else{const d=WORDS[x];
    c.innerHTML=`<span class="zk w" style="font-family:${F.family},${FALLBACK}">${x}</span><div><p>${d.yomi}</p><p class="m">${d.mean}</p></div>`}
  c.scrollIntoView({block:"nearest"});
}
$("zkBtn1").onclick=()=>openZukan("start");$("zkBtn2").onclick=()=>openZukan("over");
$("zkClose").onclick=()=>{$("zukan").hidden=true;$(zFrom).hidden=false};
addEventListener("resize",resize);

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
readCols();resize();buildMenu();syncSoundBtns();
last=performance.now();requestAnimationFrame(loop);
</script>
