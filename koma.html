<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kururi</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Busyu">
<meta name="theme-color" content="#FFF4D6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEEAE2;--ink:#2A2620;--muted:#6F675C;--field:#FBF9F5;--line:#DCD4C7;--shu:#C8402E;--ai:#2F6DB5;--gold:#E0A100;
  --dish1:#F4EFE6;--dish2:#D9CDB8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="pop"]){--bg:#15130F;--ink:#EEE8DE;--muted:#9C9384;--field:#1F1C17;--line:#3A352D;--shu:#F07A6A;--ai:#6FA8E8;--gold:#F2C14E;--dish1:#2A261F;--dish2:#141210}}
:root[data-theme="dark"]{--bg:#15130F;--ink:#EEE8DE;--muted:#9C9384;--field:#1F1C17;--line:#3A352D;--shu:#F07A6A;--ai:#6FA8E8;--gold:#F2C14E;--dish1:#2A261F;--dish2:#141210}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:8px 10px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.top{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:440px;margin-bottom:4px;gap:8px}
h1{font-size:1.3rem;font-weight:900;margin:0}
h1 span{color:var(--shu)}
.icon{font:inherit;font-size:.85rem;font-weight:700;height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
.icon[aria-pressed="false"]{opacity:.45}
.stage{position:relative;flex:1;min-height:0;width:100%;max-width:440px;display:flex;justify-content:center}
canvas{display:block;height:100%;max-width:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:16px;text-align:center;overflow-y:auto;
  background:color-mix(in srgb,var(--bg) 93%,transparent);z-index:5;border-radius:16px}
.overlay[hidden]{display:none}
.overlay.flip{transform:rotate(180deg)}
.overlay h2{font-size:clamp(1.6rem,7vw,2.2rem);font-weight:900;margin:0}
.overlay p{margin:0;color:var(--muted);line-height:1.6;font-size:.86rem}
.who{font-weight:900;font-size:1.05rem;padding:4px 14px;border-radius:999px;color:#fff}
.who.a{background:var(--shu)}.who.b{background:var(--ai)}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seg button{font:inherit;font-weight:900;font-size:.95rem;padding:7px 12px;border-radius:12px;border:2px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer;min-width:52px}
.seg button[aria-pressed="true"]{border-color:var(--shu);background:var(--shu);color:#fff}
.seg small{display:block;font-size:.62rem;font-weight:500}
.label{font-weight:700;font-size:.8rem}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;max-width:380px}
.card{font:inherit;color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:16px;padding:10px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.card[aria-pressed="true"]{border-color:var(--ec);box-shadow:0 0 0 2px var(--ec) inset}
.card{position:relative}
.card .fav{position:absolute;top:6px;left:8px;font-size:.62rem;font-weight:900;color:var(--gold)}
.card .k{font-size:2.6rem;font-weight:900;line-height:1.1;color:var(--ec)}
.card .y{font-size:.85rem;font-weight:900}
.card .el{font-size:.72rem;font-weight:700;color:#fff;background:var(--ec);border-radius:999px;padding:1px 10px;margin:2px 0}
.card .st{font-size:.68rem;color:var(--muted);line-height:1.5;text-align:left;width:100%;padding:0 4px}
.card .st b{color:var(--gold);letter-spacing:-1px}
.quizk{font-size:4.2rem;font-weight:900;line-height:1}
.choices{display:grid;gap:8px;width:100%;max-width:300px}
.choices button{font:inherit;font-size:1.3rem;font-weight:900;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
.choices button.ok{background:#2E8B57;border-color:#2E8B57;color:#fff}
.choices button.ng{background:var(--shu);border-color:var(--shu);color:#fff}
button.go,button.sub{font:inherit;font-weight:900;font-size:1.05rem;border:none;border-radius:999px;padding:11px 28px;background:var(--shu);color:#fff;cursor:pointer}
button.go:disabled{opacity:.4}
button.sub{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chart{font-size:.75rem;color:var(--muted);line-height:1.6}
.fab{position:absolute;z-index:3;border:none;border-radius:999px;font:inherit;font-weight:900;cursor:pointer;touch-action:none;padding:0 16px;height:46px}
.fab[hidden]{display:none}
#confirm{left:50%;transform:translateX(-50%);bottom:10px;background:var(--ink);color:var(--field);font-size:1rem}
#confirm.topside{bottom:auto;top:10px;transform:translateX(-50%) rotate(180deg)}
#spA{left:10px;bottom:10px;background:var(--shu);color:#fff}
#spB{right:10px;top:10px;background:var(--ai);color:#fff;transform:rotate(180deg)}
#spB.cpu{display:none}
.fab:disabled{opacity:.3}
.askbox{z-index:20!important;background:color-mix(in srgb,var(--bg) 85%,transparent)!important}
/* pop theme for kids: pastel colours, polka dots */
:root[data-theme="pop"]{--bg:#FFF4D6;--ink:#3B2F63;--muted:#7C70A3;--field:#FFFFFF;--line:#FFD3E6;--shu:#FF5C8A;--slab:#F4A259;--ai:#3D8BFF;--gold:#FFB400;--dish1:#FFFFFF;--dish2:#FFE39A}
:root[data-theme="pop"] body{background:
  radial-gradient(circle,#FFC4DD 0 7px,transparent 8px) 0 0/64px 64px,
  radial-gradient(circle,#BFE6FF 0 6px,transparent 7px) 32px 32px/64px 64px,
  radial-gradient(circle,#D7F5C4 0 4px,transparent 5px) 16px 48px/64px 64px,
  #FFF4D6}
:root[data-theme="pop"] .overlay{background:color-mix(in srgb,#FFF4D6 80%,transparent)}
:root[data-theme="pop"] #home,:root[data-theme="pop"] #zukan{background:transparent}
:root[data-theme="pop"] .tile{background:color-mix(in srgb,var(--tc) 14%,#fff);border-color:color-mix(in srgb,var(--tc) 35%,#fff);box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 45%,#fff)}
:root[data-theme="pop"] .seg button,:root[data-theme="pop"] .card,:root[data-theme="pop"] .chip{box-shadow:0 2px 0 var(--line)}
.themes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.themes button{font:inherit;font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);cursor:pointer}
.themes button[aria-pressed="true"]{background:var(--ink);color:var(--field);border-color:var(--ink)}
</style>
<script>try{const t=localStorage.getItem("bd-theme")||"pop";if(t!=="auto")document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="pop"}</script>

</head>
<body>
<div class="top">
  <button class="icon" id="backBtn">← ホーム</button>
  <h1>Kuru<span>ri</span></h1>
  <div style="display:flex;gap:6px"><button class="icon" id="voiceBtn" aria-label="読み上げ">🗣️</button><button class="icon" id="sfxBtn" aria-label="効果音">🔊</button></div>
</div>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <button class="fab" id="confirm" hidden>けってい</button>
  <button class="fab" id="spA" hidden>ひっさつ！</button>
  <button class="fab" id="spB" hidden>ひっさつ！</button>

  <div class="overlay" id="menu">
    <h2>Kuru<span style="color:var(--shu)">ri</span></h2>
    <p>漢字をコマのように回して土俵にうちだそう。字の形どうしがぶつかって引っかかるよ。はじき出すか先に止まらせたら勝ち、3回勝負で2勝したほうの勝利！</p>
    <div class="label">あそびかた</div>
    <div class="seg" id="modeSeg"><button data-v="cpu">ひとりで<small>コンピューターと</small></button><button data-v="vs">ふたりで<small>1台で交互に</small></button></div>
    <div id="lvBox"><div class="label">コンピューターの強さ</div>
      <div class="seg" id="lvSeg"><button data-v="1">よわい</button><button data-v="2">ふつう</button><button data-v="3">つよい</button></div></div>
    <div class="label">漢字の範囲</div>
    <div class="seg" id="grSeg"></div>
    <div class="label">フィールド</div>
    <div class="seg" id="fieldSeg"></div>
    <p class="chart">ぞくせいの相性：🌳き → ⛰️つち → 💧みず → 🔥ひ → ⚙️きん → 🌳き（矢印の先に強い）<br>⚪むぞくせい：にがても とくいも なし</p>
    <div class="btns"><button class="go" id="startBtn">はじめる</button><button class="sub" id="menuHome">ホーム</button></div>
  </div>

  <div class="overlay" id="pick" hidden>
    <span class="who" id="pickWho"></span>
    <p>コマにする漢字をえらぼう。字が大きくて画数が多いほど重く、少ないほど速い。</p>
    <div class="cards" id="cards"></div>
    <button class="go" id="pickOk" disabled>これにする</button>
  </div>

  <div class="overlay" id="quiz" hidden>
    <span class="who" id="quizWho"></span>
    <p>よみクイズ！正解すると回転パワーアップ</p>
    <div class="quizk" id="quizK"></div>
    <div class="choices" id="choices"></div>
    <p id="quizMsg" style="min-height:1.6em;font-weight:900;color:var(--ink)"></p>
  </div>

  <div class="overlay askbox" id="ask" hidden>
    <p class="big" id="askMsg">ゲームをやめてホームにもどりますか？</p>
    <div class="btns"><button class="go" id="askYes">もどる</button><button class="sub" id="askNo">つづける</button></div>
  </div>
  <div class="overlay" id="result" hidden>
    <h2 id="resTitle"></h2>
    <p id="resDetail" style="font-size:1rem;color:var(--ink)"></p>
    <div class="btns"><button class="go" id="againBtn">もう一回</button><button class="sub" id="menuBtn">設定</button></div>
  </div>
</div>

// region codes (where the radical sits, as fractions of the character box):
// w=whole, hX=left(へん), kX=top(かんむり), aX=bottom(あし), nX,Y=にょう, bU0,V0,U1,V1=box; "~T"=extra touch tolerance(px)
function parseRegion(code){
  const [c,t]=code.split("~"),ty=c[0],v=c.slice(1).split(",").map(Number);
  const boxes=ty==="w"?[[0,0,1,1]]:ty==="h"?[[0,0,v[0],1]]:ty==="k"?[[0,0,1,v[0]]]:ty==="a"?[[0,1-v[0],1,1]]:
    ty==="n"?[[0,0,v[0],1],[0,1-v[1],1,1]]:ty==="r"?[[1-v[0],0,1,1]]:[v];
  return{code,boxes,tol:t?+t:4};
}
const parseK=(line,rad,grp)=>{const [k,g,on,kun,mean,reg]=line.split("|");

const inkCache={};
const off=document.createElement("canvas");off.width=off.height=64;const octx=off.getContext("2d",{willReadFrequently:true});
function inkOf(k){
  if(inkCache[k]!=null)return inkCache[k];
  octx.clearRect(0,0,64,64);octx.font=`900 60px "Zen Maru Gothic",sans-serif`;octx.textAlign="center";octx.textBaseline="middle";octx.fillText(k,32,33);
  const d=octx.getImageData(0,0,64,64).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i]>110)n++;
  return inkCache[k]=n/(64*64);
}
// weight is ranked against every kanji, so the lightest is 0.8 and the heaviest 1.8 whatever the font
let inkSorted=null;
const BAL={speed:[1.15,.4],stam:[1.1,.1],mass:[.8,.8],mrExp:.5}; // tuned by simulating heavy vs light matches to about 50:50
function statsOf(k){
  if(!inkSorted)inkSorted=Object.keys(KDATA).map(inkOf).sort((a,b)=>a-b);
  const ink=inkOf(k);let i=0;while(i<inkSorted.length&&inkSorted[i]<ink)i++;
  const w=.8+i/(inkSorted.length-1);
  // heavy kanji push harder and are hard to move; light kanji launch faster and keep spinning longer
  const t=w-.8,speed=BAL.speed[0]-BAL.speed[1]*t,stamina=BAL.stam[0]-BAL.stam[1]*t,mass=(BAL.mass[0]+BAL.mass[1]*t)*4;
  return{w,speed,stamina,mass,stars:{omosa:Math.round(t*4)+1,hayasa:Math.round((1-t)*4)+1,nebari:Math.round(1-t)+3}};
}

function ac(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(actx.state==="suspended")actx.resume();return actx}
function tone(f,dur,type="triangle",vol=.12,when=0,slide=0){
  if(!sfxOn||!ac())return;const t=actx.currentTime+when,o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol,freq){
  if(!sfxOn||!ac())return;const n=Math.floor(actx.sampleRate*dur),buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();s.buffer=buf;f.type="bandpass";f.frequency.value=freq;g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(actx.destination);s.start();
}

function banner(text,color,flip){banners.push({text,color,flip,t:0})}
function drawTop(t){
  const b=t.body,x=b.position.x,y=b.position.y,e=ELEM[t.elem];
  const fall=Math.min(1,t.fall/.8),sc=t.out?1-fall*.5:1,alpha=t.out?1-fall*.7:1;
  const col=t.who==="A"?COL.shu:COL.ai,av=b.angularVelocity||0;
  ctx.font=`900 ${S0*FR}px "Zen Maru Gothic",sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
  const glyph=(ang,al)=>{ctx.save();ctx.translate(x,y);ctx.globalAlpha=alpha*al;ctx.scale(sc,sc);ctx.rotate(ang);ctx.translate(b.off.x,b.off.y);
    ctx.fillStyle=col;ctx.fillText(t.k,0,0);ctx.restore()};
  // shadow, then afterimages that show how fast it spins
  ctx.save();ctx.translate(x+3,y+5);ctx.rotate(t.angle);ctx.translate(b.off.x,b.off.y);ctx.globalAlpha=.13*alpha;ctx.fillStyle="#000";ctx.fillText(t.k,0,0);ctx.restore();
  if(phase==="battle"&&!t.stopped&&!t.out){glyph(t.angle-av*2.4,.14);glyph(t.angle-av*1.2,.25)}
  glyph(t.angle,1);
  // element badge stays upright above the kanji
  ctx.globalAlpha=alpha;ctx.font=`13px sans-serif`;ctx.fillText(e.icon,x,y-S0*.62);ctx.globalAlpha=1;
  // spin gauge
  // small spin bar (no ring around the kanji)
  if(phase==="battle"&&!t.out){const w=40,f=Math.max(0,t.spin)/Math.max(1,t.max),by=y+S0*.6;
    ctx.fillStyle=COL.line;ctx.fillRect(x-w/2,by,w,4);ctx.fillStyle=col;ctx.fillRect(x-w/2,by,w*f,4)}
  if(t.hitAdv>0){ctx.font=`900 14px "Zen Maru Gothic",sans-serif`;ctx.fillStyle=COL.gold;ctx.textAlign="center";ctx.fillText("こうかばつぐん！",x,y-TR-16)}
}
function drawHud(who,flip){
  const t=tops[who];if(!t)return;
  ctx.save();if(flip){ctx.translate(WW,WH);ctx.rotate(Math.PI)}
  const y=WH-14,col=who==="A"?COL.shu:COL.ai,e=ELEM[t.elem];
  ctx.textAlign="left";ctx.textBaseline="alphabetic";ctx.fillStyle=col;ctx.font=`900 15px "Zen Maru Gothic",sans-serif`;
  const nm=who==="A"?(mode==="cpu"?"あなた":"A"):(mode==="cpu"?"CPU":"B");
  const pos=who==="A"||flip;
  const bx=pos?118:12, by=pos?y-40:30;
  ctx.fillText(`${nm} ${"●".repeat(wins[who])}${"○".repeat(2-wins[who])}`,bx,by);
  ctx.fillStyle=COL.muted;ctx.font=`700 12px "Zen Maru Gothic",sans-serif`;
  ctx.fillText(`${t.k}（${readingOf(t.k)}） ${e.icon}${e.name}${P[who].bonus?"  ⚡パワーアップ":""}`,bx,by+16);
  ctx.restore();
}
function draw(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);ctx.clearRect(0,0,WW,WH);
  ctx.save();
  if(shakeFx>0){ctx.translate((Math.random()-.5)*shakeFx,(Math.random()-.5)*shakeFx);shakeFx*=.88;if(shakeFx<.3)shakeFx=0}
  // dish
  const g=ctx.createRadialGradient(CX,CY,10,CX,CY,R);g.addColorStop(0,COL.d1);g.addColorStop(1,COL.d2);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fill();
  ctx.lineWidth=7;ctx.strokeStyle=COL.line;
  if(!gaps.length){ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.stroke()}
  else{const gs=[...gaps].map(g=>({...g,a:((g.a%(Math.PI*2))+Math.PI*2)%(Math.PI*2)})).sort((a,b)=>a.a-b.a);
    for(let i=0;i<gs.length;i++){const g1=gs[i],g2=gs[(i+1)%gs.length];let e2=g2.a-g2.w/2;if(i===gs.length-1)e2+=Math.PI*2;
      ctx.beginPath();ctx.arc(CX,CY,R,g1.a+g1.w/2,e2);ctx.stroke()}
    ctx.strokeStyle=COL.shu;ctx.lineWidth=2;ctx.setLineDash([4,5]);for(const g of gaps){ctx.beginPath();ctx.arc(CX,CY,R+5,g.a-g.w/2,g.a+g.w/2);ctx.stroke()}ctx.setLineDash([])}
  if(FIELD.ice){ctx.save();ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.clip();ctx.fillStyle="rgba(140,200,235,.28)";ctx.fillRect(CX-R,CY-R,R*2,R*2);
    ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=2;for(let i=0;i<7;i++){const a=i*0.9,r=R*(.2+((i*37)%60)/100);ctx.beginPath();ctx.moveTo(CX+Math.cos(a)*r,CY+Math.sin(a)*r);ctx.lineTo(CX+Math.cos(a)*r+18,CY+Math.sin(a)*r-8);ctx.stroke()}ctx.restore()}
  if(FIELD.spring){ctx.strokeStyle=COL.gold;ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=120;i++){const a=i/120*Math.PI*2,r=R+(i%2?4:-4);ctx.lineTo(CX+Math.cos(a)*r,CY+Math.sin(a)*r)}ctx.stroke()}
  if(FIELD.shrink&&R<FIELD.R){ctx.strokeStyle=COL.shu;ctx.globalAlpha=.35;ctx.lineWidth=2;ctx.setLineDash([5,6]);ctx.beginPath();ctx.arc(CX,CY,FIELD.R,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1}
  if(bar){ctx.save();ctx.translate(CX,CY);ctx.rotate(barAng);ctx.fillStyle="rgba(0,0,0,.18)";ctx.fillRect(-R*.725+3,-6+5,R*1.45,12);
    ctx.fillStyle="#8B5A2B";ctx.beginPath();ctx.roundRect?ctx.roundRect(-R*.725,-6,R*1.45,12,6):ctx.rect(-R*.725,-6,R*1.45,12);ctx.fill();
    ctx.fillStyle="#C9A27A";ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();ctx.restore()}
  if(FIELD.swirl){ctx.strokeStyle=COL.line;ctx.lineWidth=3;ctx.globalAlpha=.7;
    for(let i=0;i<4;i++){ctx.beginPath();for(let s2=0;s2<=1;s2+=.05){const a=clock*.9+i*Math.PI/2+s2*2.2,r=12+s2*R*.85;ctx.lineTo(CX+Math.cos(a)*r,CY+Math.sin(a)*r)}ctx.stroke()}ctx.globalAlpha=1}
  for(const p of pillars){
    if(p.st==="warn"){ctx.strokeStyle=COL.shu;ctx.lineWidth=2;ctx.globalAlpha=.4+.4*Math.sin(clock*16);ctx.beginPath();ctx.arc(p.x,p.y,15,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
    else{ctx.fillStyle="rgba(0,0,0,.2)";ctx.beginPath();ctx.arc(p.x+3,p.y+5,13,0,Math.PI*2);ctx.fill();
      const pg=ctx.createRadialGradient(p.x-4,p.y-4,2,p.x,p.y,14);pg.addColorStop(0,"#C9B79A");pg.addColorStop(1,"#7A6A55");ctx.fillStyle=pg;ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);ctx.fill()}
  }
  ctx.strokeStyle=COL.line;ctx.lineWidth=1;ctx.globalAlpha=.5;for(const r of [R*.33,R*.66]){ctx.beginPath();ctx.arc(CX,CY,r,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;
  if(mode==="vs"&&(phase==="aimA"||phase==="aimB")){ctx.setLineDash([6,6]);ctx.strokeStyle=COL.line;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,CY);ctx.lineTo(WW,CY);ctx.stroke();ctx.setLineDash([])}
  if(engine){
    // aim arrow (only the player who is aiming sees their own)
    const who=phase==="aimA"?"A":phase==="aimB"?"B":null;
    if(who&&!isCPU(who)){
      const s=START[who];
      if(!aim[who]){ctx.font=`700 13px "Zen Maru Gothic",sans-serif`;ctx.fillStyle=COL.muted;ctx.textAlign="center";
        ctx.save();ctx.translate(s.x,s.y+(who==="A"?TR+26:-TR-26));if(who==="B"&&mode==="vs")ctx.rotate(Math.PI);ctx.fillText("うしろに引っぱって はなす",0,0);ctx.restore()}
      else{const a=aim[who],L=40+a.p*90,ex=s.x+Math.cos(a.a)*L,ey=s.y+Math.sin(a.a)*L,col=who==="A"?COL.shu:COL.ai;
        ctx.strokeStyle=col;ctx.lineWidth=5;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(ex,ey);ctx.stroke();
        ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(ex+Math.cos(a.a)*14,ey+Math.sin(a.a)*14);ctx.lineTo(ex+Math.cos(a.a+2.4)*12,ey+Math.sin(a.a+2.4)*12);ctx.lineTo(ex+Math.cos(a.a-2.4)*12,ey+Math.sin(a.a-2.4)*12);ctx.fill();
        ctx.save();ctx.translate(s.x,s.y+(who==="A"?TR+26:-TR-26));if(who==="B"&&mode==="vs")ctx.rotate(Math.PI);
        ctx.font=`900 13px "Zen Maru Gothic",sans-serif`;ctx.textAlign="center";ctx.fillText(`パワー ${Math.round(a.p*100)}`,0,0);ctx.restore()}
    }
    for(const t of Object.values(tops))drawTop(t);
    for(const s of sparks){ctx.globalAlpha=Math.max(0,s.life/.4);ctx.fillStyle=COL.gold;ctx.fillRect(s.x-1.5,s.y-1.5,3,3)}ctx.globalAlpha=1;
    drawHud("A",false);drawHud("B",mode==="vs");
    if(phase==="count"){const n=Math.ceil(count-.2);ctx.font=`900 72px "Zen Maru Gothic",sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillStyle=COL.ink;ctx.lineWidth=8;ctx.strokeStyle=COL.field;const txt=n>0?String(n):"ゴー！";ctx.strokeText(txt,CX,CY);ctx.fillText(txt,CX,CY)}
  }
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(const b of banners){const a=b.t<.2?b.t/.2:Math.max(0,1-(b.t-1.2)/.4);ctx.save();ctx.globalAlpha=a;ctx.translate(CX,CY-60);if(b.flip)ctx.rotate(Math.PI);
    ctx.font=`900 24px "Zen Maru Gothic",sans-serif`;ctx.lineWidth=6;ctx.strokeStyle=COL.field;ctx.strokeText(b.text,0,0);ctx.fillStyle=b.color;ctx.fillText(b.text,0,0);ctx.restore()}
  ctx.restore();
}
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;clock+=dt;
  if(phase==="count"&&!asking){const before=Math.ceil(count-.2);count-=dt;const now=Math.ceil(count-.2);if(now!==before)now>0?sfx("count"):sfx("go");if(count<=0)launch()}
  if(phase==="battle"&&engine&&!asking)battle(dt);
  for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt}sparks=sparks.filter(s=>s.life>0);
  for(const b of banners)b.t+=dt;banners=banners.filter(b=>b.t<1.6);
  draw();requestAnimationFrame(loop);
}
addEventListener("resize",resize);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
readCols();resize();buildMenu();syncBtns();
document.fonts&&document.fonts.load(`900 40px "Zen Maru Gothic"`,"漢字");
last=performance.now();requestAnimationFrame(loop);
</script>
</body>
